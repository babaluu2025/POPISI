<script>
// ==================== KONFIGURACIJA ====================
const SUPABASE_URL = 'https://itoyvqqssqmeyxawvulq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nbUWlCIXbB48NoBRhH4ucg_PfCAmau1';

let supabaseClient = null;
try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

let data = { cjenovnik: [], popisi: [] };
let trenutniPopis = null;
let editingArtikalIndex = null;
let prikazanPopisIndex = null;
let editingPopisArtikalIndex = null;

const MESECI = ['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];

// ==================== SUPABASE ====================
function updateSyncStatus(online) {
    const dot = document.getElementById('syncDot');
    if (dot) { dot.className = 'sync-indicator ' + (online ? 'sync-online' : 'sync-offline'); }
}

async function loadFromCloud() {
    if (!supabaseClient) { loadLocal(); updateSyncStatus(false); return; }
    try {
        const { data: result, error } = await supabaseClient.from('popis_data').select('*').eq('id', 1).single();
        if (result) { data = result.podaci || { cjenovnik: [], popisi: [] }; updateSyncStatus(true); }
        else if (error) { await supabaseClient.from('popis_data').upsert({ id: 1, podaci: data }); updateSyncStatus(true); }
    } catch(e) { loadLocal(); updateSyncStatus(false); }
}

async function saveToCloud() {
    saveLocal();
    if (!supabaseClient) return;
    try { await supabaseClient.from('popis_data').upsert({ id: 1, podaci: data }); updateSyncStatus(true); } catch(e) { updateSyncStatus(false); }
}

function loadLocal() { const s = localStorage.getItem('popis_data'); if (s) data = JSON.parse(s); }
function saveLocal() { localStorage.setItem('popis_data', JSON.stringify(data)); }

// ==================== HELPERS ====================
function normalize(str) {
    if (!str) return '';
    return str.toString().toUpperCase().trim()
        .replace(/\([^)]*\)/g, '')
        .replace(/\/S.*$/g, '')
        .replace(/\s+/g, '')
        .replace(/[-_.,]/g, '')
        .trim();
}

function parseBroj(val) {
    if (val === null || val === undefined) return 0;
    let str = val.toString().trim();
    str = str.replace(/[€%\s]/g, '');
    str = str.replace(/[−–—]/g, '-');
    str = str.replace(/^\+/, '');
    if (str.includes('.') && str.includes(',')) {
        str = str.replace(/\./g, '').replace(',', '.');
    } else {
        str = str.replace(',', '.');
    }
    const num = parseFloat(str);
    return isNaN(num) ? 0 : num;
}

function toStr(val) { return (val === null || val === undefined) ? '' : val.toString(); }
function formatBroj(n) { 
    if (n === 0 || !n) return '0'; 
    return n.toLocaleString('hr-HR', { maximumFractionDigits: 3 }); 
}

function nadjiCijenu(naziv) {
    if (!naziv) return null;
    const norm = normalize(naziv);
    if (!norm) return null;
    let found = data.cjenovnik.find(c => normalize(c.naziv) === norm);
    if (found) return found;
    found = data.cjenovnik.find(c => {
        const cn = normalize(c.naziv);
        return cn.length >= 6 && norm.length >= 6 && cn.substring(0, 8) === norm.substring(0, 8);
    });
    if (found) return found;
    const nb = norm.match(/\d+/);
    if (nb) {
        found = data.cjenovnik.find(c => {
            const cn = normalize(c.naziv);
            const cb = cn.match(/\d+/);
            return cb && cn.substring(0, 5) === norm.substring(0, 5) && cb[0] === nb[0];
        });
        if (found) return found;
    }
    found = data.cjenovnik.find(c => {
        const cn = normalize(c.naziv);
        return cn.length >= 4 && norm.length >= 4 && cn.substring(0, 4) === norm.substring(0, 4);
    });
    return found || null;
}

function showModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function bojaVrijednosti(v) {
    if (v < 0) return '#dc3545';
    if (v > 0) return '#28a745';
    return '#666';
}

// ==================== INIT ====================
document.getElementById('loginBtn').onclick = async () => {
    if (document.getElementById('passwordInput').value === '123') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        await loadFromCloud();
        const sel = document.getElementById('noviMesec');
        sel.innerHTML = MESECI.map((m, i) => `<option value="${i}">${m}</option>`).join('');
        sel.value = new Date().getMonth();
        document.getElementById('noviGodina').value = new Date().getFullYear();
        renderMain();
    }
};

document.getElementById('logoutBtn').onclick = () => {
    document.getElementById('appContent').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
};

// ==================== GLAVNI EKRAN ====================
function renderMain() {
    const c = document.getElementById('mainContent');
    if (data.popisi.length === 0) {
        c.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">Nema popisa. Kliknite "+ Novi popis".</p>';
        return;
    }
    let html = '<h2 style="margin-bottom:15px;">📋 Popisi</h2>';
    const sorted = [...data.popisi].sort((a, b) => {
        if (a.godina !== b.godina) return b.godina - a.godina;
        return b.mesec - a.mesec;
    });
    sorted.forEach(p => {
        let ukupnoManjak = 0;
        (p.artikli || []).forEach(a => { 
            const kol = (a.visak || 0) - (a.manjak || 0);
            ukupnoManjak += kol * (a.cijena || 0); 
        });
        const originalIndex = data.popisi.indexOf(p);
        html += `
            <div class="popis-card" onclick="prikaziPopis(${originalIndex})">
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                    <div>
                        <h3 style="font-size:18px;">📅 ${MESECI[p.mesec]} ${p.godina} - ${p.sektor}</h3>
                        <span style="font-size:13px;color:#666;">${(p.artikli || []).length} artikala</span>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:20px;font-weight:bold;color:${bojaVrijednosti(ukupnoManjak)};">${ukupnoManjak.toFixed(2)} €</div>
                        <span style="font-size:11px;color:#666;">${ukupnoManjak < 0 ? 'Manjak' : (ukupnoManjak > 0 ? 'Višak' : 'Poklapa se')}</span>
                    </div>
                </div>
            </div>`;
    });
    c.innerHTML = html;
}

// ==================== NOVI POPIS ====================
function showNoviPopis() {
    trenutniPopis = null;
    document.getElementById('excelInput').value = '';
    document.getElementById('previewNovi').innerHTML = '';
    document.getElementById('dugmadNovi').style.display = 'none';
    showModal('noviPopisModal');
}

function ucitajExcel(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const wb = XLSX.read(e.target.result, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
            
            let headerIndex = -1;
            for (let i = 0; i < rows.length; i++) {
                const row = (rows[i] || []).map(c => toStr(c).toLowerCase());
                if (row.some(c => c.includes('naziv')) && row.some(c => c.includes('manjak'))) {
                    headerIndex = i; break;
                }
            }
            if (headerIndex === -1) { alert('❌ Ne mogu da nađem header red'); return; }
            
            const header = rows[headerIndex].map(c => toStr(c).toLowerCase().trim());
            const idxNaziv = header.findIndex(h => h.includes('naziv'));
            const idxJM = header.findIndex(h => h.includes('j.m') || h === 'jm');
            const idxManjak = header.findIndex(h => h.includes('manjak'));
            const idxVisak = header.findIndex(h => h.includes('višak') || h.includes('visak'));
            const idxCijena = header.findIndex(h => h.includes('cijena'));
            
            const artikli = [];
            for (let i = headerIndex + 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || !row[idxNaziv]) continue;
                const naziv = toStr(row[idxNaziv]).trim();
                if (!naziv || naziv.toLowerCase().includes('ukupno') || naziv.toLowerCase().includes('naplaceno')) continue;
                
                const jm = idxJM >= 0 ? toStr(row[idxJM]).trim() : '';
                const manjak = idxManjak >= 0 ? parseBroj(row[idxManjak]) : 0;
                const visak = idxVisak >= 0 ? parseBroj(row[idxVisak]) : 0;
                const kolicina = visak - manjak;
                
                let cijena = 0;
                let pronadjena = false;
                if (idxCijena >= 0 && row[idxCijena]) {
                    cijena = parseBroj(row[idxCijena]);
                    pronadjena = cijena > 0;
                }
                if (cijena === 0) {
                    const cj = nadjiCijenu(naziv);
                    if (cj) { cijena = cj.cijena; pronadjena = true; }
                }
                
                const vrijednost = kolicina * cijena;
                
                artikli.push({
                    naziv, jm, manjak, visak, kolicina, cijena, vrijednost,
                    grupa: '', pronadjena
                });
            }
            
            if (artikli.length === 0) { alert('❌ Nema artikala u fajlu'); return; }
            
            trenutniPopis = { artikli: artikli };
            renderPreviewNovi();
            document.getElementById('dugmadNovi').style.display = 'flex';
        } catch (err) {
            console.error(err);
            alert('❌ Greška: ' + err.message);
        }
    };
    reader.readAsBinaryString(file);
}

function renderPreviewNovi() {
    const artikli = trenutniPopis.artikli;
    const bezCijene = artikli.filter(a => !a.pronadjena).length;
    const saCijenom = artikli.length - bezCijene;
    
    let html = '';
    if (bezCijene > 0) {
        html += `<div class="info-box info-warning">
            <strong>⚠️ ${bezCijene} artikala bez cijene</strong> – upiši cijene u crvena polja
        </div>`;
    }
    if (saCijenom > 0) {
        html += `<div class="info-box info-success">
            <strong>✅ ${saCijenom} artikala ima cijenu</strong>
        </div>`;
    }
    
    html += '<table class="artikal-table" style="font-size:13px;"><thead><tr>';
    html += '<th>Naziv</th><th>J.M.</th><th>Manjak</th><th>Višak</th><th>Konačno</th><th>Cijena €</th><th>Vrijednost €</th>';
    html += '</tr></thead><tbody>';
    
    let ukupno = 0;
    artikli.forEach((a, idx) => {
        a.kolicina = a.visak - a.manjak;
        a.vrijednost = a.kolicina * a.cijena;
        ukupno += a.vrijednost;
        
        const redClass = a.pronadjena ? '' : 'red-bez-cijene';
        const boja = bojaVrijednosti(a.vrijednost);
        const bojaKolicine = a.kolicina < 0 ? '#dc3545' : (a.kolicina > 0 ? '#28a745' : '#666');
        
        html += `<tr class="${redClass}">
            <td>${a.naziv}</td>
            <td>${a.jm}</td>
            <td style="color:#dc3545;">${formatBroj(a.manjak)}</td>
            <td style="color:#28a745;">${formatBroj(a.visak)}</td>
            <td style="font-weight:bold;color:${bojaKolicine};">${a.kolicina > 0 ? '+' : ''}${formatBroj(a.kolicina)}</td>
            <td>`;
        
        if (a.pronadjena) {
            html += `<span class="cijena-ok">${a.cijena.toFixed(3)}</span>`;
        } else {
            html += `<input type="number" class="cijena-input" step="any" min="0" 
                value="${a.cijena || ''}" placeholder="0.000"
                onchange="azurirajCijenuNovi(${idx}, this.value)">`;
        }
        
        html += `</td>
            <td style="font-weight:bold;color:${boja};">${a.vrijednost.toFixed(2)}</td>
        </tr>`;
    });
    
    html += `<tr class="total-row"><td colspan="6" style="text-align:right;">UKUPNO:</td><td style="color:${bojaVrijednosti(ukupno)};">${ukupno.toFixed(2)} €</td></tr>`;
    html += '</tbody></table>';
    
    document.getElementById('previewNovi').innerHTML = html;
}

function azurirajCijenuNovi(index, vrijednost) {
    const cijena = parseFloat(vrijednost) || 0;
    trenutniPopis.artikli[index].cijena = cijena;
    trenutniPopis.artikli[index].kolicina = trenutniPopis.artikli[index].visak - trenutniPopis.artikli[index].manjak;
    trenutniPopis.artikli[index].vrijednost = trenutniPopis.artikli[index].kolicina * cijena;
    trenutniPopis.artikli[index].pronadjena = cijena > 0;
    renderPreviewNovi();
}

async function sacuvajCijeneICjenovnik() {
    if (!trenutniPopis) return;
    
    const bezCijene = trenutniPopis.artikli.filter(a => a.cijena > 0 && !a.pronadjena);
    if (bezCijene.length === 0) { alert('Nema novih cijena.'); return; }
    
    let count = 0;
    for (const a of bezCijene) {
        const existing = data.cjenovnik.findIndex(c => normalize(c.naziv) === normalize(a.naziv));
        if (existing >= 0) {
            data.cjenovnik[existing].cijena = a.cijena;
        } else {
            data.cjenovnik.push({
                naziv: a.naziv, grupa: a.grupa || '', jm: a.jm || 'KOM.', cijena: a.cijena
            });
        }
        a.pronadjena = true;
        count++;
    }
    
    trenutniPopis.artikli.forEach(a => { 
        a.kolicina = a.visak - a.manjak;
        a.vrijednost = a.kolicina * a.cijena; 
    });
    
    await saveToCloud();
    renderPreviewNovi();
    alert(`✅ Sačuvano ${count} cijena!`);
}

function ucitajCjenovnik(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const wb = XLSX.read(e.target.result, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
            
            let headerIndex = -1;
            for (let i = 0; i < rows.length; i++) {
                const row = (rows[i] || []).map(c => toStr(c).toLowerCase());
                if (row.some(c => c.includes('naziv')) && row.some(c => c.includes('cijena'))) {
                    headerIndex = i; break;
                }
            }
            if (headerIndex === -1) { alert('❌ Ne mogu da nađem header (Naziv, Cijena).'); return; }
            
            const header = rows[headerIndex].map(c => toStr(c).toLowerCase().trim());
            const idxNaziv = header.findIndex(h => h.includes('naziv'));
            const idxGrupa = header.findIndex(h => h.includes('grupa'));
            const idxJM = header.findIndex(h => h.includes('j.m') || h === 'jm');
            const idxCijena = header.findIndex(h => h.includes('cijena'));
            
            let count = 0;
            for (let i = headerIndex + 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || !row[idxNaziv]) continue;
                const naziv = toStr(row[idxNaziv]).trim();
                if (!naziv) continue;
                const grupa = idxGrupa >= 0 ? toStr(row[idxGrupa]).trim() : '';
                const jm = idxJM >= 0 ? toStr(row[idxJM]).trim() : '';
                const cijena = idxCijena >= 0 ? parseBroj(row[idxCijena]) : 0;
                
                const existing = data.cjenovnik.findIndex(c => normalize(c.naziv) === normalize(naziv));
                if (existing >= 0) {
                    data.cjenovnik[existing] = { naziv, grupa, jm, cijena };
                } else {
                    data.cjenovnik.push({ naziv, grupa, jm, cijena });
                }
                count++;
            }
            
            await saveToCloud();
            renderCjenovnik();
            alert(`✅ Učitano ${count} artikala`);
        } catch (err) { alert('❌ Greška: ' + err.message); }
    };
    reader.readAsBinaryString(file);
}

// ==================== MENADŽER ====================
function showManager() {
    document.getElementById('managerGodina').value = new Date().getFullYear();
    renderManager();
    showModal('managerModal');
}

function renderManager() {
    const godina = parseInt(document.getElementById('managerGodina').value);
    const sektor = document.getElementById('managerSektor').value;
    const c = document.getElementById('managerContent');
    
    const popisi = data.popisi.filter(p => p.godina === godina && p.sektor === sektor).sort((a, b) => a.mesec - b.mesec);
    if (popisi.length === 0) {
        c.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">Nema popisa.</p>';
        return;
    }
    
    const artikliSet = new Set();
    popisi.forEach(p => (p.artikli || []).forEach(a => artikliSet.add(a.naziv)));
    const artikli = Array.from(artikliSet).sort();
    
    let html = '<div style="overflow-x:auto;"><table class="artikal-table"><thead><tr><th style="min-width:180px;">Artikal</th>';
    popisi.forEach(p => { html += `<th>${MESECI[p.mesec].substring(0,3)}<br><small>€</small></th>`; });
    html += '<th>UKUPNO</th></tr></thead><tbody>';
    
    const totalPoMjesecu = {};
    artikli.forEach(naziv => {
        html += `<tr><td style="font-weight:bold;">${naziv}</td>`;
        let ukupnoArtikal = 0;
        popisi.forEach(p => {
            const a = (p.artikli || []).find(x => x.naziv === naziv);
            let v = 0;
            if (a) {
                const kol = (a.visak || 0) - (a.manjak || 0);
                v = kol * (a.cijena || 0);
            }
            ukupnoArtikal += v;
            if (!totalPoMjesecu[p.mesec]) totalPoMjesecu[p.mesec] = 0;
            totalPoMjesecu[p.mesec] += v;
            html += `<td style="color:${bojaVrijednosti(v)};">${v !== 0 ? v.toFixed(2) : '-'}</td>`;
        });
        html += `<td style="font-weight:bold;background:#fff3cd;color:${bojaVrijednosti(ukupnoArtikal)};">${ukupnoArtikal.toFixed(2)} €</td></tr>`;
    });
    
    html += `<tr class="total-row"><td>UKUPNO:</td>`;
    let grand = 0;
    popisi.forEach(p => {
        const t = totalPoMjesecu[p.mesec] || 0;
        grand += t;
        html += `<td style="color:${bojaVrijednosti(t)};">${t.toFixed(2)} €</td>`;
    });
    html += `<td style="color:${bojaVrijednosti(grand)};">${grand.toFixed(2)} €</td></tr></tbody></table></div>`;
    c.innerHTML = html;
}

// ==================== ŠTAMPANJE ====================
function stampajPopis() {
    if (prikazanPopisIndex === null) return;
    const p = data.popisi[prikazanPopisIndex];
    
    let pc = `<h2 style="text-align:center;">${MESECI[p.mesec].toUpperCase()} ${p.godina} - ${p.sektor}</h2>`;
    pc += '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:15px;">';
    pc += '<tr style="background:#f0f0f0;"><th style="border:1px solid #000;padding:6px;text-align:left;">Naziv</th><th style="border:1px solid #000;padding:6px;">J.M.</th><th style="border:1px solid #000;padding:6px;">Manjak</th><th style="border:1px solid #000;padding:6px;">Višak</th><th style="border:1px solid #000;padding:6px;">Konačno</th><th style="border:1px solid #000;padding:6px;">VRIJEDNOST</th></tr>';
    
    let ukupno = 0;
    (p.artikli || []).forEach(a => {
        const kol = (a.visak || 0) - (a.manjak || 0);
        const v = kol * (a.cijena || 0);
        ukupno += v;
        pc += `<tr>
            <td style="border:1px solid #000;padding:4px;">${a.naziv}</td>
            <td style="border:1px solid #000;padding:4px;text-align:center;">${a.jm}</td>
            <td style="border:1px solid #000;padding:4px;text-align:right;">${formatBroj(a.manjak)}</td>
            <td style="border:1px solid #000;padding:4px;text-align:right;">${formatBroj(a.visak)}</td>
            <td style="border:1px solid #000;padding:4px;text-align:right;font-weight:bold;">${kol > 0 ? '+' : ''}${formatBroj(kol)}</td>
            <td style="border:1px solid #000;padding:4px;text-align:right;font-weight:bold;">${v.toFixed(2)}</td>
        </tr>`;
    });
    pc += `<tr style="background:#fff3cd;font-weight:bold;"><td colspan="5" style="border:1px solid #000;padding:6px;text-align:right;">UKUPNO:</td><td style="border:1px solid #000;padding:6px;text-align:right;">${ukupno.toFixed(2)} €</td></tr></table>`;
    
    const win = window.open('', '_blank');
    win.document.write(`<html><head><title>Popis</title><style>body{font-family:Arial;padding:15px;}</style></head><body>${pc}</body></html>`);
    win.document.close(); win.print();
}

function stampajManager() {
    const c = document.getElementById('managerContent');
    const win = window.open('', '_blank');
    win.document.write(`<html><head><title>Menadžer</title><style>body{font-family:Arial;padding:15px;font-size:11px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:4px;}</style></head><body><h2>Menadžer - Sumarni pregled</h2>${c.innerHTML}</body></html>`);
    win.document.close(); win.print();
}

// ==================== EXPORT / IMPORT ====================
function exportData() { showModal('exportModal'); }

function downloadBackup() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `popis_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function shareToGmail() {
    downloadBackup();
    setTimeout(() => { window.location.href = 'https://mail.google.com/mail/?view=cm&fs=1&tf=1&su=Popis Backup'; }, 1000);
    alert('📧 Gmail: Prikačite preuzeti fajl.');
}

function shareToDrive() {
    downloadBackup();
    setTimeout(() => { window.location.href = 'https://drive.google.com/drive/my-drive'; }, 1000);
    alert('📗 Drive: "+ Novo" → "File upload".');
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const imported = JSON.parse(event.target.result);
                if (imported && (imported.cjenovnik || imported.popisi)) {
                    if (confirm('⚠️ Uvoz će PREBRIŠATI podatke. Nastaviti?')) {
                        data = imported;
                        await saveToCloud();
                        renderMain();
                        alert('✅ Uvezeno!');
                    }
                } else { alert('❌ Neispravan fajl!'); }
            } catch (e) { alert('❌ Greška: ' + e.message); }
        };
        reader.readAsText(file);
    };
    input.click();
}

async function resetAll() {
    const sifra = prompt('🔒 Šifra za reset:');
    if (sifra === '1978') {
        if (confirm('⚠️ Resetovati SVE?')) {
            localStorage.removeItem('popis_data');
            data = { cjenovnik: [], popisi: [] };
            await saveToCloud();
            renderMain();
            alert('✅ Resetovano!');
        }
    } else if (sifra !== null) { alert('❌ Pogrešna šifra!'); }
}

window.onclick = function(event) {
    if (event.target.classList.contains('modal')) event.target.classList.remove('active');
};
</script>
